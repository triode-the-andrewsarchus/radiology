[workspace]
members = ["crates/reader-text"]
resolver = "2"

[package]
name = "radiology"
version = "0.2.0"
edition = "2021"
authors = ["Radiology contributors"]
description = "Fast, read-only Linux-native repository browser for understanding unfamiliar codebases"
license = "MIT OR Apache-2.0"

[lib]
name = "radiology"
path = "src/lib.rs"

[[bin]]
name = "radiology"
path = "src/main.rs"

[dependencies]
reader-text = { path = "crates/reader-text" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["svg"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
regex = "1.10"
uuid = { version = "1.9", features = ["v4", "serde"] }
chrono = "0.4"
url = "2.5"
dirs = "5.0"
unicode-width = "0.2"
unicode-normalization = "0.1"
base64 = "0.21"
rfd = "0.15"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"

[dev-dependencies]
tempfile = "3.10"

# Optional patch for Wayland window sizing on egui 0.27 if needed
[patch.crates-io]
# egui-winit = { path = "/home/vcarlson/little-screen-clip/vendor/egui-winit" }
